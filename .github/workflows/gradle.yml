name: CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # Sets up Gradle and caches dependencies / build state between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # `build` compiles and runs the JUnit test suite.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # Publishes JUnit results as a check run with inline annotations on failures.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: JUnit Report (JDK ${{ matrix.java }})
          fail_on_failure: true

      # Keeps the HTML report and raw XML available for download on every run.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
